name: IRIS ML CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc-gs

      # Temporarily skip DVC pull
      - name: Skip DVC Pull
        run: |
          echo "Skipping dvc pull because GitHub Actions cannot authenticate to the private GCS bucket."

      - name: Check Dataset Exists
        run: |
          if [ -f iris.csv ]; then
            echo "iris.csv found"
          else
            echo "iris.csv not found"
          fi

      - name: Check Model Exists
        run: |
          if [ -f models/model.pkl ]; then
            echo "model.pkl found"
          else
            echo "model.pkl not found"
          fi

      - name: Run Data Validation Tests
        run: |
          pytest tests/test_data.py

      - name: Run Model Evaluation Tests
        run: |
          pytest tests/test_model.py

      - name: Generate Test Report
        run: |
          echo "# IRIS CI Report" > report.md
          echo "" >> report.md
          echo "## Data Validation" >> report.md
          pytest tests/test_data.py >> report.md || true
          echo "" >> report.md
          echo "## Model Evaluation" >> report.md
          pytest tests/test_model.py >> report.md || true

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-report
          path: report.md
