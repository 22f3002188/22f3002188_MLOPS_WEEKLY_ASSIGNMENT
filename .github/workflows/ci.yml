name: IRIS CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas scikit-learn joblib
          pip install feast
          pip install dvc dvc-gs
          pip install pyarrow

      - name: Install CML
        run: |
          sudo apt-get update
          sudo apt-get install -y npm
          npm install -g @dvcorg/cml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_KEY }}'

      - name: Verify Authentication
        run: |
          gcloud auth list || true

      - name: Pull DVC Data
        run: |
          dvc pull -v

      - name: Verify Files
        run: |
          ls -la
          ls -la models

          test -f iris.csv
          test -f models/model.pkl

      - name: Run Data Validation Tests
        run: |
          pytest tests/test_data.py -v | tee data_test.txt

      - name: Run Model Evaluation Tests
        run: |
          pytest tests/test_model.py -v | tee model_test.txt

      - name: Generate Report
        if: always()
        run: |
          echo "# Week 4 CI Report" > report.md
          echo "" >> report.md
          echo "## Data Validation Tests" >> report.md
          cat data_test.txt >> report.md
          echo "" >> report.md
          echo "## Model Evaluation Tests" >> report.md
          cat model_test.txt >> report.md

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: report.md

      - name: Comment PR with CML
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md
