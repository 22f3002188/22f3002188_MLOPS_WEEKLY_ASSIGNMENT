name: IRIS ML CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Install DVC
      - name: Install DVC
        run: |
          pip install dvc-gs

      # Pull Data and Model
      - name: Pull Data and Model
        run: |
          dvc pull

      # Run Data Validation Tests
      - name: Run Data Validation Tests
        run: |
          pytest tests/test_data.py

      # Run Model Evaluation Tests
      - name: Run Model Evaluation Tests
        run: |
          pytest tests/test_model.py

      # Generate Test Report
      - name: Generate Test Report
        run: |
          echo "# Week 4 CI Report" > report.md
          echo "" >> report.md
          echo "## Data Validation" >> report.md
          pytest tests/test_data.py >> report.md
          echo "" >> report.md
          echo "## Model Evaluation" >> report.md
          pytest tests/test_model.py >> report.md

      # Publish Report with CML
      - name: Publish Report with CML
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx @dvcorg/cml comment create report.md
