name: IRIS ML CI

on:
  push:
    branches:
      - week_4
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "cml>=0.20"

      - name: Install DVC
        run: |
          pip install dvc-gs

      - name: Configure Google Cloud Credentials
        env:
          GCP_SERVICE_KEY: ${{ secrets.GCP_SERVICE_KEY }}
        run: |
          echo "$GCP_SERVICE_KEY" > gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json" >> $GITHUB_ENV

      - name: Pull Data and Model
        run: |
          dvc pull

      - name: Run Data Validation Tests
        run: |
          pytest tests/test_data.py

      - name: Run Model Evaluation Tests
        run: |
          pytest tests/test_model.py

      - name: Generate Test Report
        run: |
          echo "# IRIS CI Report" > report.md
          echo "" >> report.md

          echo "## Data Validation" >> report.md
          pytest tests/test_data.py >> report.md

          echo "" >> report.md
          echo "## Model Evaluation" >> report.md
          pytest tests/test_model.py >> report.md

      - name: Publish Report using CML
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md
