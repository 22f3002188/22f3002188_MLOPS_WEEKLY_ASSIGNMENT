name: IRIS ML CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install DVC
        run: |
          pip install dvc-gs

      - name: Pull Data and Model
        run: |
          dvc pull

      - name: Run Data Validation Tests
        run: |
          pytest tests/test_data.py

      - name: Run Model Evaluation Tests
        run: |
          pytest tests/test_model.py

      - name: Generate Test Report
        run: |
          echo "# Week 4 CI Report" > report.md
          echo "" >> report.md
          echo "## Data Validation" >> report.md
          pytest tests/test_data.py >> report.md
          echo "" >> report.md
          echo "## Model Evaluation" >> report.md
          pytest tests/test_model.py >> report.md

      - name: Publish Report with CML
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx @dvcorg/cml comment create report.md
